services:
  claude-server:
    build: .
    image: claude-server:latest
    container_name: claude-server
    ports:
      - "${PORT:-9001}:9001"
    env_file:
      - .env
    environment:
      WORKSPACE_DIR: /home1/irteam/workspace
    volumes:
      - claude-workspace:/home1/irteam/workspace
    restart: unless-stopped

volumes:
  claude-workspace:
